[package]
name = "runcached"
version = "0.1.0"
edition = "2021"
description = "Run shell commands with output caching."

[[bin]]
name = "runcached"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
glob = "0.3"
shlex = "1"
directories = "5"
humantime = "2"
regex = "1"

[profile.release]
strip = true
